[project]
name = "Lexicall"
version = "0.1.0"
description = "Schema-constrained function calling with a small local LLM"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.26",
    "pydantic>=2.10,<3",
    "regex>=2024.11.6",
    "transformers>=4.51,<5",
    "accelerate>=1.0",
]

[project.optional-dependencies]
dev = ["autopep8>=2.3", "flake8>=7", "mypy>=1.14", "types-regex"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.mypy]
exclude = ["^assets/llm_sdk/"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
ignore_missing_imports = true
follow_imports = "skip"
